name: Lumine CI Pipeline

# when to run
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # download source code
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    #setup java 21
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven' # automatically cache and restore all dependencies

    # build and test
    - name: Build and Test with Maven
      run: mvn clean verify

    # upload test results (If you want to download later)
    - name: Upload Test Report
      if: always() #run even if the test fails
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: "**/target/surefire-reports/*.xml"