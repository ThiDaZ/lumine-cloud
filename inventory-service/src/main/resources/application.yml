server:
  port: 8082

spring:
  application:
    name: inventory-service
  datasource:
    url: jdbc:postgresql://localhost:5432/lumine_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa: #jpa
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  boot: # for zipkin
    admin:
      client:
        url: http://localhost:9411

management: #zipkin
  tracing:
    sampling:
      probability: 1.0 # log 100% of requests (For Development)
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
