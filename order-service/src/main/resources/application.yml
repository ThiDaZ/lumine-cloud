server:
  port: 8083

spring:
  application:
    name: order-service
  kafka: # kafka configuration
    bootstrap-servers: localhost:9092
    template:
      default-topic: notificationTopic
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false # helps to avoid package name conflicts
  datasource:
    url: jdbc:postgresql://localhost:5432/lumine_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  boot: # for zipkin
    admin:
      client:
        url: http://localhost:9411

management: #zipkin
  tracing:
    sampling:
      probability: 1.0 # log 100% of requests (For Development)
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

resilience4j:
  circuitbreaker:
    instances:
      inventory:
        registerHealthIndicator: true
        eventConsumerBufferSize: 10
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5 # Check the last 5 calls
        failureRateThreshold: 50 # If 50% fail, trip the breaker
        waitDurationInOpenState: 5s # Wait 5 seconds before trying again
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true