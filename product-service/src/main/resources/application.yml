server:
  port: 8081

spring:
  application:
    name: product-service
  data:
    mongodb:
      # make sure to set up the env for username and password
      uri: mongodb://${MONGO_USER:admin}:${MONGO_PASSWORD:password}@localhost:27017/product_db?authSource=admin
  boot: # for zipkin
    admin:
      client:
        url: http://localhost:9411

management: #zipkin
  tracing:
    sampling:
      probability: 1.0 # log 100% of requests (For Development)
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

